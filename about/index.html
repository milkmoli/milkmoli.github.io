    <!-- Completely eliminate flash of wrong theme -->
    <script>
        (function() {
            const THEME_KEY = "REDEFINE-THEME-STATUS";
            const DARK = "dark", LIGHT = "light";
            
            // Get preferred theme
            function getTheme() {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved) {
                        const { isDark } = JSON.parse(saved);
                        return isDark ? DARK : LIGHT;
                    }
                } catch (e) {}
                
                return matchMedia("(prefers-color-scheme: dark)").matches ? DARK : LIGHT;
            }
            
            // Apply theme to document
            function applyTheme(theme) {
                const isDark = theme === DARK;
                const root = document.documentElement;
                
                // Set classes for compatibility
                root.classList.add(theme);
                root.classList.remove(isDark ? LIGHT : DARK);
                root.style.colorScheme = theme;
            }
            
            // Initial application
            const theme = getTheme();
            applyTheme(theme);
            
            // Listen for system preference changes
            matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ({ matches }) => {
                // Only update if using system preference (no localStorage entry)
                if (!localStorage.getItem(THEME_KEY)) {
                    applyTheme(matches ? DARK : LIGHT);
                }
            });
            
            // Set body classes ASAP (before DOMContentLoaded)
            (function() {
                const addBodyClass = () => {
                    const b = document.body;
                    if (!b) return false;
                    b.classList.add(theme + "-mode");
                    return true;
                };

                // Try immediately
                if (addBodyClass()) return;

                // Observe until body exists
                const mo = new MutationObserver(() => {
                    if (addBodyClass()) mo.disconnect();
                });
                mo.observe(document.documentElement, { childList: true, subtree: true });
            })();
        })();
    </script>

  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <script>
    (function() {
      var box = document.getElementById('encryptBox');
      var input = document.getElementById('encPwdInput');
      var btn = document.getElementById('unlockBtn');
      var errorMsg = document.getElementById('errorMsg');
      var wrapper = document.getElementById('inputWrapper');
      var dataContainer = document.getElementById('encryptedData');
      var contentContainer = document.getElementById('decryptedContent');

      var cipherContent = dataContainer.dataset.content;
      var cipherKeys = JSON.parse(dataContainer.dataset.keys);
      var maxTries = parseInt(dataContainer.dataset.maxTries) || 3;
      var postId = dataContainer.dataset.postid || '';
      var remember = dataContainer.dataset.remember;
      var rememberDays = parseInt(dataContainer.dataset.rememberDays) || 7;

      var tries = 0;
      var locked = false;

      // ----- 记忆功能辅助函数 -----
      function getStorage() {
        // 如果 remember === 'session' 使用 sessionStorage，否则用 localStorage
        return remember === 'session' ? sessionStorage : localStorage;
      }

      function getCacheKey() {
        return 'hexo_encrypt_' + postId;
      }

      function loadFromCache() {
        if (!remember) return false; // 不记忆
        try {
          var storage = getStorage();
          var cached = storage.getItem(getCacheKey());
          if (!cached) return false;
          var data = JSON.parse(cached);
          var now = Date.now();
          // 检查是否过期（仅当 localStorage 且 rememberDays > 0）
          if (remember !== 'session' && rememberDays > 0) {
            if (now - data.timestamp > rememberDays * 24 * 60 * 60 * 1000) {
              storage.removeItem(getCacheKey());
              return false;
            }
          }
          // 缓存有效，直接显示
          showContent(data.content);
          return true;
        } catch(e) {
          return false;
        }
      }

      function saveToCache(plainText) {
        if (!remember) return;
        try {
          var storage = getStorage();
          var cacheData = {
            content: plainText,
            timestamp: Date.now()
          };
          storage.setItem(getCacheKey(), JSON.stringify(cacheData));
        } catch(e) {}
      }

      function clearCache() {
        try {
          var storage = getStorage();
          storage.removeItem(getCacheKey());
        } catch(e) {}
      }

      // ----- 显示内容（并保存缓存） -----
      function showContent(plainText) {
        var reEncryptHtml = `
          <div class="re-encrypt-wrapper">
            <button class="re-encrypt-btn" onclick="reEncrypt()">加密</button>
          </div>
        `;
        contentContainer.innerHTML = plainText + reEncryptHtml;
        contentContainer.style.display = 'block';
        box.style.display = 'none';

        if (window.MathJax && MathJax.typeset) {
          MathJax.typeset();
        }
        // 保存缓存
        saveToCache(plainText);
      }

      // ----- 浮动标签控制 -----
      function updateLabel() {
        if (input === document.activeElement || input.value.length > 0) {
          wrapper.classList.add('active');
        } else {
          wrapper.classList.remove('active');
        }
      }

      input.addEventListener('focus', updateLabel);
      input.addEventListener('blur', updateLabel);
      input.addEventListener('input', updateLabel);
      updateLabel();

      // ----- 错误显示 -----
      function showError(msg) {
        errorMsg.textContent = msg || '密码错误';
        errorMsg.classList.add('show');
        input.value = '';
        input.focus();
      }

      function hideError() {
        errorMsg.classList.remove('show');
      }
      input.addEventListener('input', hideError);

      // ----- 锁定输入 -----
      function lockInput() {
        locked = true;
        input.disabled = true;
        btn.disabled = true;
        if (!errorMsg.classList.contains('show')) {
          showError('密码错误');
        }
      }

      // ----- 重置所有状态（用于重新加密） -----
      function resetEncryptForm() {
        box.style.display = 'block';
        contentContainer.style.display = 'none';
        input.value = '';
        input.disabled = false;
        btn.disabled = false;
        locked = false;
        tries = 0;
        hideError();
        wrapper.classList.remove('active');
        // 清除缓存
        clearCache();
        input.focus();
      }

      // ----- 解密核心 -----
      function unlockArticle() {
        if (locked) return;
        var pwd = input.value.trim();
        if (!pwd) {
          showError('请输入密码');
          return;
        }

        var randomKey = null;
        for (var i = 0; i < cipherKeys.length; i++) {
          try {
            var decrypted = CryptoJS.AES.decrypt(cipherKeys[i], pwd).toString(CryptoJS.enc.Utf8);
            if (decrypted && decrypted.length > 0) {
              randomKey = decrypted;
              break;
            }
          } catch(e) {}
        }

        if (!randomKey) {
          tries++;
          if (tries >= maxTries) {
            lockInput();
          }
          showError('密码错误');
          return;
        }

        try {
          var plain = CryptoJS.AES.decrypt(cipherContent, randomKey).toString(CryptoJS.enc.Utf8);
          if (!plain) {
            throw new Error('解密失败');
          }
          showContent(plain);
        } catch(e) {
          tries++;
          if (tries >= maxTries) {
            lockInput();
          }
          showError('密码错误');
        }
      }

      // ----- 重新加密（暴露到全局） -----
      window.reEncrypt = function() {
        resetEncryptForm();
      };

      // ----- 回车触发 -----
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          unlockArticle();
        }
      });

      btn.addEventListener('click', unlockArticle);

      // ----- 初始化：尝试从缓存加载 -----
      var loaded = loadFromCache();
      if (!loaded) {
        // 无缓存，显示输入框
        input.focus();
      }
      // 暴露解锁函数（以备不时之需）
      window.unlockArticle = unlockArticle;
    })();
  </script>
