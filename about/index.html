 fa-arrow-up"></i></button></div></div><div><script src="/js/utils.js?v=5.5.2"></script><script src="/js/main.js?v=5.5.2"></script><div class="js-pjax"></div><script>
  // 1. 基础配置（替换为你的密码）
  const PASSWORD = 'shengyibei';
  const VERIFY_KEY = 'site_pwd_verified';
  let isVerified = false; // 初始化变量，解决未定义报错

  // 2. 检测localStorage是否可用（兼容Safari无痕模式）
  function isLocalStorageSupported() {
    const testKey = '__test_safari_storage__';
    try {
      localStorage.setItem(testKey, testKey);
      localStorage.removeItem(testKey);
      return true;
    } catch (e) {
      return false;
    }
  }

  // 3. 读取验证状态（优先localStorage，失败用Cookie兜底）
  function getVerifyState() {
    // 先检查localStorage
    if (isLocalStorageSupported()) {
      return localStorage.getItem(VERIFY_KEY) === 'true';
    }
    // localStorage不可用时，读取Cookie
    const cookies = document.cookie.split('; ');
    for (let cookie of cookies) {
      const [key, value] = cookie.split('=');
      if (key === VERIFY_KEY && value === 'true') {
        return true;
      }
    }
    return false;
  }

  // 4. 保存验证状态（兼容Safari）
  function saveVerifyState() {
    if (isLocalStorageSupported()) {
      localStorage.setItem(VERIFY_KEY, 'true');
    } else {
      // Cookie有效期6小时，适配无痕模式
      document.cookie = `${VERIFY_KEY}=true; max-age=21600; path=/; SameSite=Lax`;
    }
  }

  // 5. 封装验证函数
  function verifyPassword(inputVal) {
    const pwdInput = document.getElementById('pwd-input');
    const errorTip = document.getElementById('error-tip');
    if (!pwdInput || !errorTip) return; // 防止元素未加载报错

    const val = inputVal.trim();
    if (val === PASSWORD) {
      saveVerifyState();
      document.getElementById('pwd-modal')?.remove(); // 可选链避免报错
    } else {
      errorTip.style.display = 'block';
      pwdInput.value = '';
      setTimeout(() => {
        errorTip.style.display = 'none';
      }, 3000);
    }
  }

  // 6. 核心逻辑：检查验证状态（关键：提前赋值isVerified）
  isVerified = getVerifyState();

  // 7. 未验证则显示密码面板
  if (!isVerified) {
    // 构建面板HTML
    const pwdHtml = `
      <div id="pwd-modal">
        <div class="pwd-content">
          <h3 class="pwd-title">该网站需要密码访问</h3>
          <input type="password" id="pwd-input" placeholder="请输入密码">
          <button id="pwd-btn">确认</button>
          <p id="error-tip">密码错误，请重新输入！</p>
        </div>
      </div>
    `;
    // 插入面板（确保DOM加载完成）
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        document.body.insertAdjacentHTML('afterbegin', pwdHtml);
        bindEvents();
      });
    } else {
      document.body.insertAdjacentHTML('afterbegin', pwdHtml);
      bindEvents();
    }
  }

  // 8. 绑定事件（抽离函数，避免重复代码）
  function bindEvents() {
    const pwdInput = document.getElementById('pwd-input');
    const pwdBtn = document.getElementById('pwd-btn');
    if (!pwdInput || !pwdBtn) return;

    // 自动聚焦
    pwdInput.focus();

    // 回车验证
    pwdInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        verifyPassword(pwdInput.value);
      }
    });

    // 按钮点击验证
    pwdBtn.addEventListener('click', () => {
      verifyPassword(pwdInput.value);
    });
  }
</script>
