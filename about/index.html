    <!-- Completely eliminate flash of wrong theme -->
    <script>
        (function() {
            const THEME_KEY = "REDEFINE-THEME-STATUS";
            const DARK = "dark", LIGHT = "light";
            
            // Get preferred theme
            function getTheme() {
                try {
                    const saved = localStorage.getItem(THEME_KEY);
                    if (saved) {
                        const { isDark } = JSON.parse(saved);
                        return isDark ? DARK : LIGHT;
                    }
                } catch (e) {}
                
                return matchMedia("(prefers-color-scheme: dark)").matches ? DARK : LIGHT;
            }
            
            // Apply theme to document
            function applyTheme(theme) {
                const isDark = theme === DARK;
                const root = document.documentElement;
                
                // Set classes for compatibility
                root.classList.add(theme);
                root.classList.remove(isDark ? LIGHT : DARK);
                root.style.colorScheme = theme;
            }
            
            // Initial application
            const theme = getTheme();
            applyTheme(theme);
            
            // Listen for system preference changes
            matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ({ matches }) => {
                // Only update if using system preference (no localStorage entry)
                if (!localStorage.getItem(THEME_KEY)) {
                    applyTheme(matches ? DARK : LIGHT);
                }
            });
            
            // Set body classes ASAP (before DOMContentLoaded)
            (function() {
                const addBodyClass = () => {
                    const b = document.body;
                    if (!b) return false;
                    b.classList.add(theme + "-mode");
                    return true;
                };

                // Try immediately
                if (addBodyClass()) return;

                // Observe until body exists
                const mo = new MutationObserver(() => {
                    if (addBodyClass()) mo.disconnect();
                });
                mo.observe(document.documentElement, { childList: true, subtree: true });
            })();
        })();
    </script>

  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
  <script>
    (function() {
      // ----- 工具函数 -----
      function getData() {
        var container = document.getElementById('encryptedData');
        if (!container) return null;
        return {
          cipherContent: container.dataset.content,
          cipherKeys: JSON.parse(container.dataset.keys),
          maxTries: parseInt(container.dataset.maxTries) || 3,
          postId: container.dataset.postid || '',
          remember: container.dataset.remember,
          rememberDays: parseInt(container.dataset.rememberDays) || 7
        };
      }

      function getElements() {
        return {
          box: document.getElementById('encryptBox'),
          input: document.getElementById('encPwdInput'),
          btn: document.getElementById('unlockBtn'),
          errorMsg: document.getElementById('errorMsg'),
          wrapper: document.getElementById('inputWrapper'),
          contentContainer: document.getElementById('decryptedContent')
        };
      }

      function getStorage(remember) {
        return remember === 'session' ? sessionStorage : localStorage;
      }

      function getCacheKey(postId) {
        return 'hexo_encrypt_' + postId;
      }

      // ----- 显示内容（并保存缓存） -----
      function showContent(plainText) {
        var el = getElements();
        var reEncryptHtml = `
          <div class="re-encrypt-wrapper">
            <button class="re-encrypt-btn" onclick="reEncrypt()">加密</button>
          </div>
        `;
        el.contentContainer.innerHTML = plainText + reEncryptHtml;
        el.contentContainer.style.display = 'block';
        el.box.style.display = 'none';

        if (window.MathJax && MathJax.typeset) {
          MathJax.typeset();
        }

        // 保存缓存
        var data = getData();
        if (data && data.remember) {
          try {
            var storage = getStorage(data.remember);
            var cacheData = {
              content: plainText,
              timestamp: Date.now()
            };
            storage.setItem(getCacheKey(data.postId), JSON.stringify(cacheData));
          } catch(e) {}
        }
      }

      // ----- 加载缓存 -----
      function loadFromCache() {
        var data = getData();
        if (!data || !data.remember) return false;
        try {
          var storage = getStorage(data.remember);
          var cached = storage.getItem(getCacheKey(data.postId));
          if (!cached) return false;
          var cache = JSON.parse(cached);
          var now = Date.now();
          if (data.remember !== 'session' && data.rememberDays > 0) {
            if (now - cache.timestamp > data.rememberDays * 24 * 60 * 60 * 1000) {
              storage.removeItem(getCacheKey(data.postId));
              return false;
            }
          }
          showContent(cache.content);
          return true;
        } catch(e) {
          return false;
        }
      }

      // ----- 清除缓存 -----
      function clearCache() {
        var data = getData();
        if (!data) return;
        try {
          var storage = getStorage(data.remember);
          storage.removeItem(getCacheKey(data.postId));
        } catch(e) {}
      }

      // ----- 更新标签状态 -----
      function updateLabel() {
        var el = getElements();
        if (!el.input || !el.wrapper) return;
        if (el.input === document.activeElement || el.input.value.length > 0) {
          el.wrapper.classList.add('active');
        } else {
          el.wrapper.classList.remove('active');
        }
      }

      // ----- 显示错误 -----
      function showError(msg) {
        var el = getElements();
        if (!el.errorMsg || !el.input) return;
        el.errorMsg.textContent = msg || '密码错误';
        el.errorMsg.classList.add('show');
        el.input.value = '';
        el.input.focus();
      }

      function hideError() {
        var el = getElements();
        if (el.errorMsg) {
          el.errorMsg.classList.remove('show');
        }
      }

      // ----- 锁定输入 -----
      function lockInput() {
        var el = getElements();
        if (!el.input || !el.btn) return;
        el.input.disabled = true;
        el.btn.disabled = true;
        if (!el.errorMsg.classList.contains('show')) {
          showError('密码错误');
        }
      }

      // ----- 重置表单（重新加密） -----
      function resetEncryptForm() {
        var el = getElements();
        if (!el.box || !el.contentContainer || !el.input || !el.btn || !el.errorMsg || !el.wrapper) return;
        el.box.style.display = 'block';
        el.contentContainer.style.display = 'none';
        el.input.value = '';
        el.input.disabled = false;
        el.btn.disabled = false;
        hideError();
        el.wrapper.classList.remove('active');
        clearCache();
        el.input.focus();
      }

      // ----- 解密核心（全局函数） -----
      window.unlockArticle = function() {
        var el = getElements();
        var data = getData();
        if (!el.input || !el.btn || !el.errorMsg || !data) return;
        if (el.input.disabled) return; // 已锁定

        var pwd = el.input.value.trim();
        if (!pwd) {
          showError('请输入密码');
          return;
        }

        var randomKey = null;
        for (var i = 0; i < data.cipherKeys.length; i++) {
          try {
            var decrypted = CryptoJS.AES.decrypt(data.cipherKeys[i], pwd).toString(CryptoJS.enc.Utf8);
            if (decrypted && decrypted.length > 0) {
              randomKey = decrypted;
              break;
            }
          } catch(e) {}
        }

        if (!randomKey) {
          // 错误次数（需要维护全局计数器）
          if (!window._encryptTries) window._encryptTries = 0;
          window._encryptTries++;
          if (window._encryptTries >= data.maxTries) {
            lockInput();
          }
          showError('密码错误');
          return;
        }

        try {
          var plain = CryptoJS.AES.decrypt(data.cipherContent, randomKey).toString(CryptoJS.enc.Utf8);
          if (!plain) {
            throw new Error('解密失败');
          }
          showContent(plain);
          // 重置尝试次数
          window._encryptTries = 0;
        } catch(e) {
          if (!window._encryptTries) window._encryptTries = 0;
          window._encryptTries++;
          if (window._encryptTries >= data.maxTries) {
            lockInput();
          }
          showError('密码错误');
        }
      };

      // ----- 重新加密（全局） -----
      window.reEncrypt = function() {
        resetEncryptForm();
        window._encryptTries = 0;
      };

      // ----- 事件委托绑定 -----
      function bindEvents() {
        // 输入框获得/失去焦点、输入时更新标签和清除错误
        document.addEventListener('focusin', function(e) {
          if (e.target.id === 'encPwdInput') {
            updateLabel();
          }
        });
        document.addEventListener('focusout', function(e) {
          if (e.target.id === 'encPwdInput') {
            updateLabel();
          }
        });
        document.addEventListener('input', function(e) {
          if (e.target.id === 'encPwdInput') {
            hideError();
            updateLabel();
          }
        });
        // 回车键
        document.addEventListener('keydown', function(e) {
          if (e.target.id === 'encPwdInput' && e.key === 'Enter') {
            e.preventDefault();
            window.unlockArticle();
          }
        });
        // 按钮点击（如果用户点击按钮，也触发解锁）
        document.addEventListener('click', function(e) {
          if (e.target.id === 'unlockBtn') {
            window.unlockArticle();
          }
        });
      }

      // ----- 初始化 -----
      function init() {
        // 先尝试加载缓存
        var loaded = loadFromCache();
        if (!loaded) {
          var el = getElements();
          if (el.input) {
            el.input.focus();
            updateLabel();
          }
        }
        // 重置尝试次数
        window._encryptTries = 0;
      }

      // 绑定事件（只执行一次）
      bindEvents();

      // DOM 加载完成后初始化
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
